name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Test your code on multiple Python versions
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics
      
      - name: Run tests
        run: pytest test_calculator.py -v

  # JOB 2: Deploy to OpenShift (only runs if tests pass on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          oc version
      
      - name: Login to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          oc login $OPENSHIFT_SERVER --token=$OPENSHIFT_TOKEN --insecure-skip-tls-verify=true
          oc project $OPENSHIFT_NAMESPACE
          oc status
      
      - name: Deploy Python app to OpenShift
        run: |
          # Delete existing resources if they exist
          oc delete deployment calculator-app --ignore-not-found=true
          oc delete service calculator-app --ignore-not-found=true
          oc delete route calculator-app --ignore-not-found=true
          
          # Create deployment from public Python image
          oc create deployment calculator-app --image=python:3.10-slim
          
          # Expose the deployment as a service
          oc expose deployment calculator-app --port=8080
          
          # Create a route to access the app
          oc expose service calculator-app
          
          # Wait for pod to be ready
          sleep 30
          
          # Show deployment status
          oc get pods
          oc get svc
          oc get route
          
          # Show the application URL
          echo "Application URL:"
          oc get route calculator-app -o jsonpath='{.spec.host}'
      
      - name: Show final deployment status
        run: oc status
