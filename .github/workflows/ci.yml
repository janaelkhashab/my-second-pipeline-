name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Test your code
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics
      
      - name: Run tests
        run: pytest test_calculator.py -v
  
  # JOB 2: Build and deploy to OpenShift (only runs on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: test  # Only runs if tests pass
    if: github.ref == 'refs/heads/main'  # Only on main branch
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}
          insecure_skip_tls_verify: true
      
      - name: Create and deploy app
        uses: redhat-actions/oc-new-app@v1
        with:
          app_name: calculator-app
          image: python:3.10-slim
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}
      
      - name: Expose the app with a Route
        run: |
          oc expose svc/calculator-app
          oc get route calculator-app -o jsonpath='{.spec.host}'
      
      - name: Show deployment status
        run: oc status
