name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # JOB 1: Test your code on multiple Python versions
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

      - name: Run tests
        run: pytest test_calculator.py -v


  # JOB 2: Build Docker image and deploy to OpenShift
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:

      # Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker image from your Dockerfile
      # and push it to GitHub Container Registry

      # Build Docker image
      # -------------------------
      - name: Build Docker image
        env:
          REGISTRY: ${{ secrets.OPENSHIFT_REGISTRY }}
          NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          docker build \
            -t "$REGISTRY/$NAMESPACE/calculator-app:latest" .


      # -------------------------
      # Push image to OpenShift
      # -------------------------
      - name: Push Docker image
        env:
          REGISTRY: ${{ secrets.OPENSHIFT_REGISTRY }}
          NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          docker push "$REGISTRY/$NAMESPACE/calculator-app:latest"


      # Install OpenShift CLI
      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          oc version

      # Login to OpenShift
      - name: Login to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          oc login "$OPENSHIFT_SERVER" \
            --token="$OPENSHIFT_TOKEN" \
            --insecure-skip-tls-verify=true

          oc project "$OPENSHIFT_NAMESPACE"

      # Deploy your Docker image to OpenShift
      - name: Deploy application
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/calculator-app:latest"

          oc delete deployment calculator-app --ignore-not-found=true
          oc delete service calculator-app --ignore-not-found=true
          oc delete route calculator-app --ignore-not-found=true

          oc create deployment calculator-app --image="$IMAGE"

          oc expose deployment calculator-app --port=8080
          oc expose service calculator-app

          oc rollout status deployment/calculator-app --timeout=180s

          echo "Pods:"
          oc get pods

          echo "Service:"
          oc get service calculator-app

          echo "Route:"
          oc get route calculator-app

          echo "Application URL:"
          echo "https://$(oc get route calculator-app -o jsonpath='{.spec.host}')"
