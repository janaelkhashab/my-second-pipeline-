name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ==========================================
  # JOB 1: TEST
  # ==========================================
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

      - name: Run tests
        run: |
          pytest test_calculator.py -v


  # ==========================================
  # JOB 2: BUILD + PUSH + DEPLOY
  # ==========================================
  deploy:
    runs-on: ubuntu-latest

    # Deploy only after ALL test matrix jobs pass
    needs: test

    # Deploy only when code is pushed to main
    if: github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ------------------------------------------
      # 2. Install OpenShift CLI
      # ------------------------------------------
      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/

          oc version


      # ------------------------------------------
      # 3. Login to OpenShift
      # ------------------------------------------
      - name: Login to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}

        run: |
          oc login "$OPENSHIFT_SERVER" \
            --token="$OPENSHIFT_TOKEN" \
            --insecure-skip-tls-verify=true

          oc project "$OPENSHIFT_NAMESPACE"

          echo "Logged into OpenShift"
          echo "Project: $OPENSHIFT_NAMESPACE"


      # ------------------------------------------
      # 4. Get OpenShift Registry
      # ------------------------------------------
      - name: Get OpenShift Registry
        run: |
          REGISTRY=$(oc registry info --public)

          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

          echo "OpenShift Registry:"
          echo "$REGISTRY"


      # ------------------------------------------
      # 5. Login to OpenShift Image Registry
      # ------------------------------------------
      - name: Login to OpenShift Image Registry
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}

        run: |
          echo "$OPENSHIFT_TOKEN" | docker login "$REGISTRY" \
            --username=unused \
            --password-stdin


      # ------------------------------------------
      # 6. Build Docker Image
      # ------------------------------------------
      - name: Build Docker Image
        env:
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}

        run: |

          IMAGE="$REGISTRY/$OPENSHIFT_NAMESPACE/calculator-app:latest"

          echo "Building image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            .


      # ------------------------------------------
      # 7. Push Image to OpenShift Registry
      # ------------------------------------------
      - name: Push Docker Image
        env:
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}

        run: |

          IMAGE="$REGISTRY/$OPENSHIFT_NAMESPACE/calculator-app:latest"

          echo "Pushing image:"
          echo "$IMAGE"

          docker push "$IMAGE"


      # ------------------------------------------
      # 8. Deploy Application to OpenShift
      # ------------------------------------------
      - name: Deploy Application
        env:
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}

        run: |

          IMAGE="$REGISTRY/$OPENSHIFT_NAMESPACE/calculator-app:latest"

          echo "Deploying:"
          echo "$IMAGE"


          # Remove old deployment
          oc delete deployment calculator-app \
            --ignore-not-found=true


          # Remove old service
          oc delete service calculator-app \
            --ignore-not-found=true


          # Remove old route
          oc delete route calculator-app \
            --ignore-not-found=true


          # Create deployment using OUR Docker image
          oc create deployment calculator-app \
            --image="$IMAGE"


          # Expose application on port 8080
          oc expose deployment calculator-app \
            --port=8080


          # Create OpenShift route
          oc expose service calculator-app


      # ------------------------------------------
      # 9. Wait for Deployment
      # ------------------------------------------
      - name: Wait for Deployment
        run: |

          oc rollout status deployment/calculator-app \
            --timeout=180s


      # ------------------------------------------
      # 10. Show Deployment Information
      # ------------------------------------------
      - name: Show Deployment Status
        run: |

          echo "================================"
          echo "PODS"
          echo "================================"

          oc get pods


          echo "================================"
          echo "SERVICE"
          echo "================================"

          oc get service calculator-app


          echo "================================"
          echo "ROUTE"
          echo "================================"

          oc get route calculator-app


          echo "================================"
          echo "APPLICATION URL"
          echo "================================"

          HOST=$(oc get route calculator-app \
            -o jsonpath='{.spec.host}')

          echo "https://$HOST"
