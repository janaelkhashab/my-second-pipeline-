name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Test your code
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics
      
      - name: Run tests
        run: pytest test_calculator.py -v
  
  # JOB 2: Build and deploy to OpenShift
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # STEP 1: Install OpenShift CLI (oc)
      - name: Install OpenShift CLI
        run: |
          # Download oc binary
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          # Extract it
          tar -xzf openshift-client-linux.tar.gz
          # Move it to a directory in PATH
          sudo mv oc /usr/local/bin/
          # Verify it's installed
          oc version
      
      # STEP 2: Log in to OpenShift
      - name: Log in to OpenShift
        run: |
          oc login ${{ secrets.OPENSHIFT_SERVER }} --token=${{ secrets.OPENSHIFT_TOKEN }} --insecure-skip-tls-verify=true
          oc project ${{ secrets.OPENSHIFT_NAMESPACE }}
          oc status
      
      # STEP 3: Deploy the app
      - name: Deploy to OpenShift
        run: |
          # Delete existing app if it exists (ignore errors if it doesn't)
          oc delete all -l app=calculator-app --ignore-not-found=true
          
          # Create the app from the Dockerfile in your repo
          oc new-app . --name=calculator-app --strategy=docker
          
          # Wait for build to complete
          echo "Waiting for build to complete..."
          sleep 60
          
          # Expose the route
          oc expose svc/calculator-app
          
          # Show the URL
          echo "Application URL:"
          oc get route calculator-app -o jsonpath='{.spec.host}'
      
      # STEP 4: Show status
      - name: Show deployment status
        run: oc status
